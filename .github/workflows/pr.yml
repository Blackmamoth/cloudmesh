name: PR Check

on:
    pull_request: 
        branches: 
            - main

permissions:
  contents: read

jobs:
    api-checks:
        name: API (Go) checks
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: api
        steps:
            - uses: actions/checkout@v5
            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                go-version: '1.24'

            - name: Install dependencies
              run: go mod tidy
            
            - name: golangci-lint
              uses: golangci/golangci-lint-action@v8
              with:
                version: v2.4.0
                working-directory: api


